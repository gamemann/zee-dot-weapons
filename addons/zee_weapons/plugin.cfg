[plugin]

name="zee-dot-weapons"
description="A weapons pack for the Dot ecosystem: twenty-six weapons as dot-weapon catalogue rows, plus the half dot-weapon deliberately leaves out — a first-person view model with arms, a third-person world model, procedural animation driven by the arsenal's own signals, and the replication that makes another player's weapon look right. Depends on dot-core, dot-combat and dot-weapon; everything else is duck-typed."
author="gamemann"
version="0.1.0"
script="zee_weapons_plugin.gd"
